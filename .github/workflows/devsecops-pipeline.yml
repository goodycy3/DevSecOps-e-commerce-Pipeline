name: DevSecOps E-commerce Pipeline

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      LOCAL_IMAGE: mini-devsecops-project:${{ github.sha }}
      DH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mini-devsecops-project:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (load to local engine)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          push: false

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.goodycyb011 }}
          password: ${{ secrets.dckr_pat_Xv8tXfdIpKoSdWYzxrQZXzzhcWo }}

      - name: Tag and push
        if: github.event_name == 'push'
        run: |
          docker tag ${{ env.LOCAL_IMAGE }} ${{ env.DH_IMAGE }}
          docker push ${{ env.DH_IMAGE }}
