name: DevSecOps E-commerce Pipeline

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LOCAL_IMAGE: mini-devsecops-project:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (load to local engine)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          push: false
       
      # Scan for Vulnerabilities 
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Fail early if secrets are missing (only on push)
      - name: Check Docker Hub secrets
        if: github.event_name == 'push'
        run: |
          test -n "${{ vars.DOCKERHUB_USERNAME }}" || { echo "Missing DOCKERHUB_USERNAME"; exit 1; }
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || { echo "Missing DOCKERHUB_TOKEN"; exit 1; }

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push
        if: github.event_name == 'push'
        run: |
          DH_IMAGE="${{ vars.DOCKERHUB_USERNAME }}/mini-devsecops-project:latest"
          docker tag "${{ env.LOCAL_IMAGE }}" "$DH_IMAGE"
          docker push "$DH_IMAGE"
