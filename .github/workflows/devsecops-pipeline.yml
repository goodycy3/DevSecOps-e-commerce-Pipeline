name: DevSecOps E-commerce Pipeline

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

# --- Job 1: SAST with Semgrep (blocks build on findings) ---
jobs:
  semgrep-sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      # 1 Run Semgrep and capture full JSON & SARIF, but don't stop the job yet
      - name: Semgrep scan (OWASP Top 10)
        id: semgrep
        continue-on-error: false
        run: |
          semgrep --config p/owasp-top-ten --metrics=off \
                  --json -o semgrep.json \
                  --sarif -o semgrep.sarif --verbose

      # 2 Print a tidy summary to logs (rule id, file, line, message)
      - name: Summarise findings to logs
        run: |
          count=$(jq '.results | length' semgrep.json)
          echo "Semgrep findings: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.results[] | "\(.check_id)  \(.path):\(.start.line)  \(.extra.message)"' semgrep.json
          fi

      # 3 Upload SARIF to GitHub code scanning (nice UI on the repo)
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      # 4 Gate: fail the job if any findings exist
      - name: Fail when findings exist
        run: |
          count=$(jq '.results | length' semgrep.json)
          if [ "$count" -gt 0 ]; then
            echo "::error::Semgrep found $count blocking findings"
            exit 1
          fi

# --- Job 2: Build, scan container with Trivy, then push on push events ---
  build-scan-push:
    needs: semgrep-sast
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      LOCAL_IMAGE: mini-devsecops-project:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (load to local engine)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          push: false

      # Container vulnerability scan (gate)
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Only push on push (not PRs)
      - name: Check Docker Hub secrets
        if: github.event_name == 'push'
        run: |
          test -n "${{ vars.DOCKERHUB_USERNAME }}" || { echo "Missing DOCKERHUB_USERNAME"; exit 1; }
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || { echo "Missing DOCKERHUB_TOKEN"; exit 1; }

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push
        if: github.event_name == 'push'
        run: |
          DH_IMAGE="${{ vars.DOCKERHUB_USERNAME }}/mini-devsecops-project:latest"
          docker tag "${{ env.LOCAL_IMAGE }}" "$DH_IMAGE"
          docker push "$DH_IMAGE"
