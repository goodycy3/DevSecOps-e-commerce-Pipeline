name: DevSecOps E-commerce Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step to build the image, so we can scan it before pushing
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true # Important: load the image to the runner
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mini-devsecops-project:latest
          push: false # We will push only after the scan is successful

      # === SECURITY GATE ===
      # Scan the image for vulnerabilities with Trivy
      - name: Scan image with Trivy
        run: |
          trivy image --format table --exit-code 1 --severity HIGH,CRITICAL --no-progress ${{ secrets.DOCKERHUB_USERNAME }}/mini-devsecops-project:latest
        # --exit-code 1: If vulnerabilities are found, the command fails.
        # --severity HIGH,CRITICAL: Only fail for these severities.

      # This step will only run if the Trivy scan above succeeds
      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/mini-devsecops-project:latest
