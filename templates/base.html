<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Mini E-commerce Store{% endblock %}</title>

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- App CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased relative overflow-x-hidden">

  <!-- Decorative gradient blobs -->
  <div aria-hidden="true" class="pointer-events-none absolute -top-40 -left-32 h-96 w-96 rounded-full bg-gradient-to-tr from-indigo-400 to-fuchsia-400 blur-3xl opacity-25"></div>
  <div aria-hidden="true" class="pointer-events-none absolute -bottom-40 -right-32 h-[28rem] w-[28rem] rounded-full bg-gradient-to-tr from-blue-400 to-cyan-400 blur-3xl opacity-25"></div>

  <!-- Navbar -->
  <header id="header" class="sticky top-0 z-50">
    <nav class="glass supports-backdrop-blur">
      <div class="container mx-auto px-6 py-4 flex items-center justify-between">
        <a href="/" class="flex items-center gap-3 group">
          <span class="logo-chip grid place-items-center">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2a10 10 0 1010 10A10.011 10.011 0 0012 2zm1 14.93V20h-2v-3.07a8.1 8.1 0 01-4.62-2.39l1.45-1.45A6.1 6.1 0 0011 15h2a6.1 6.1 0 003.17-.91l1.45 1.45A8.1 8.1 0 0113 16.93zM8 12a4 4 0 118-0 4 4 0 01-8 0z"/>
            </svg>
          </span>
          <span class="text-xl font-extrabold tracking-tight">
            <span class="gradient-text">Tech</span> Store
          </span>
        </a>

        <div class="hidden md:flex items-center gap-6">
          <a href="#products" class="nav-link">Products</a>
          <a href="#newsletter" class="nav-link">Newsletter</a>
          <button id="themeToggle" class="btn-ghost">Toggle theme</button>
          <a href="#" class="btn-primary shine">
            <svg class="h-5 w-5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M3 3h18v4H3zM3 7l2 14h14l2-14"/>
            </svg>
            Cart
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container mx-auto px-6 py-12">{% block content %}{% endblock %}</main>

  <footer class="bg-slate-900 text-white mt-16 relative overflow-hidden">
    <div class="container mx-auto px-6 py-10 text-center">
      <p class="text-lg font-semibold">© 2024 Tech Store · Mini DevSecOps Project</p>
      <p class="text-slate-400 mt-2">Built to demo automated security scanning in CI/CD.</p>

      <!-- Intentionally unsafe pattern (tabnabbing + open redirect style) -->
      <p class="mt-4">
        <a id="ext-offer-link"
           class="text-cyan-300 underline hover:text-cyan-200 transition"
           target="_blank"
           href="{{ request.args.get('next', 'https://example.com/offers') }}">
          External Offers
        </a>
      </p>

      <div class="mt-6 flex items-center justify-center gap-4 text-slate-400">
        <svg class="h-5 w-5"><circle cx="10" cy="10" r="9" stroke="currentColor" fill="none"/></svg>
        <svg class="h-5 w-5"><rect x="3" y="3" width="14" height="14" stroke="currentColor" fill="none" rx="3"/></svg>
        <svg class="h-5 w-5"><polygon points="5,3 19,12 5,21" stroke="currentColor" fill="none"/></svg>
      </div>
    </div>
  </footer>

  <!-- App JS -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
